{{define "admin_style"}}
<style>
  @font-face { font-family: Barlow; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/Barlow-Regular.ttf') format('truetype'); }
  @font-face { font-family: Barlow; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/fonts/Barlow-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; font-display: swap; src: url('/assets/fonts/BarlowCondensed-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 800; font-display: swap; src: url('/assets/fonts/BarlowCondensed-ExtraBold.ttf') format('truetype'); }
  :root { color-scheme: dark; --ink: #eeeee5; --paper: #151715; --panel: #1e211e; --accent: #d4e36c; --line: #3c4038; --muted: #b4b8ae; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font: 1rem/1.65 Barlow, "Segoe UI", sans-serif; }
  main { max-width: 76rem; margin: 0 auto; padding: 0 2.5rem 3rem; }
  a { color: var(--accent); text-underline-offset: .25em; }
  a:hover { color: var(--ink); }
  h1, h2, h3, p { overflow-wrap: anywhere; }
  h1, h2, h3 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  h1 { font-size: clamp(2.5rem, 6vw, 4rem); line-height: 1.08; margin: .6rem 0 1rem; letter-spacing: -.015em; text-transform: uppercase; }
  h2 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 1rem; }
  h3 { font-size: 1.85rem; line-height: 1.15; margin: 0 0 .65rem; }
  p { margin: .65rem 0 1.25rem; }
  .eyebrow, .badge, .section-label { font: 600 .78rem/1.5 Barlow, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
  .eyebrow { color: var(--accent); }
  .masthead { display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; min-height: 6rem; border-bottom: 1px solid var(--line); }
  .brand { font: 800 2rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; color: var(--ink); text-decoration: none; letter-spacing: .015em; text-transform: uppercase; }
  .masthead-note, .muted { color: var(--muted); }
  .masthead-note { font: 600 .75rem Barlow, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  header:not(.masthead) { padding: 2.5rem 0 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--line); }
  header > p:not(.eyebrow) { color: var(--muted); max-width: 42rem; }
  nav, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.5rem; }
  .admin-nav { margin-top: 2rem; }
  .admin-nav a { text-decoration: none; padding: .55rem 0; }
  .admin-nav a[aria-current="page"] { color: var(--ink); border-bottom: 2px solid var(--accent); }
  .admin-nav form { margin-left: auto; }
  section { padding: 1.5rem 0; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-top: 1rem; }
  input, select, button { font: inherit; max-width: 100%; }
  input, select { display: block; width: 100%; padding: .75rem .9rem; margin: .4rem 0 1rem; background: #141613; color: var(--ink); border: 1px solid #656b5e; border-radius: 2px; }
  input::placeholder { color: #92978a; }
  button, .button { display: inline-block; background: var(--accent); color: #1c2112; border: 1px solid var(--accent); border-radius: 2px; padding: .7rem 1.1rem; cursor: pointer; text-decoration: none; font-weight: 600; font-size: .9rem; transition: background .15s, border-color .15s; }
  button:hover, .button:hover { background: #e5f294; color: #1c2112; }
  button.secondary, .button.secondary { background: transparent; color: var(--ink); border-color: #656b5e; }
  button.secondary:hover, .button.secondary:hover { background: #30352d; border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .error { border-left: 3px solid #ff997f; padding: 1rem 1.25rem; background: #402921; color: #ffd5c7; }
  [role="status"] { padding: 1rem 1.25rem; border-left: 3px solid #b5c99c; background: #293125; }
  form { margin: 0; }
  .panel, .profile { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 1.75rem; }
  .household-layout { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.4fr); align-items: start; gap: 2.5rem; }
  .household-layout > section { min-width: 0; }
  .profiles { padding: 0; margin: 0; list-style: none; }
  .profile { margin-bottom: 1.25rem; }
  .profile > p, .panel > p { color: var(--muted); font-size: .9rem; }
  .rename { margin-bottom: 1.25rem; }
  .token { font-family: "Courier New", monospace; font-size: .95rem; }
  .token-panel { border: 1px solid var(--accent); background: var(--panel); padding: 1.5rem; margin: 2rem 0; border-radius: 3px; }
  .auth-page { max-width: 44rem; }
  .auth-panel { margin: 4rem 0; }
  .search-form { max-width: 48rem; }
  .search-row { display: flex; align-items: stretch; gap: .75rem; margin-top: .4rem; }
  .search-row input { flex: 1; min-width: 0; margin: 0; }
  .search-row button { flex-shrink: 0; }
  #challenge-year { max-width: 10rem; }
  fieldset { border: 0; padding: 0; margin: 1rem 0 1.5rem; min-width: 0; }
  legend { color: var(--muted); font-size: .9rem; padding: 0 0 .75rem; }
  .movie-option { display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--line); margin: 0 0 .5rem; border-radius: 2px; cursor: pointer; }
  .movie-option:hover, .movie-option:has(input:checked) { background: #30352a; border-color: var(--accent); }
  .movie-option input { flex-shrink: 0; width: 1.1rem; height: 1.1rem; margin: 0; accent-color: var(--accent); }
  .movie-option small { font-weight: normal; color: var(--muted); }
  .pagination { margin-top: 1.5rem; }
  .credits, .site-footer { border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 1.5rem; font-size: .8rem; color: var(--muted); }
  .credits p { margin: .3rem 0; }
  .site-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem 2rem; }
  .site-footer p { margin: 0; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 16rem; gap: 3rem; align-items: center; padding: 2.75rem 0; }
  .hero h1 { font-size: clamp(3.75rem, 7vw, 6rem); line-height: .92; font-weight: 800; max-width: 48rem; margin: 1.25rem 0 1.75rem; }
  .hero h1 .hero-accent { color: var(--accent); }
  .hero-copy { max-width: 31rem; color: var(--muted); font-size: 1.1rem; }
  .ticket { color: var(--ink); background: var(--panel); text-align: center; padding: 1.25rem; border: 1px solid #656b5e; border-top: 4px solid var(--accent); }
  .ticket-number { display: block; font: 800 8rem/.9 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: -.03em; color: var(--accent); padding: 1.25rem 0 1.5rem; }
  .ticket .section-label { display: block; border-top: 1px dashed #656b5e; padding-top: 1rem; }
  .ticket-top { font: 600 .8rem Barlow, sans-serif; letter-spacing: .12em; }
  .year-nav { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 1rem 0; gap: 1rem 2rem; }
  .year-nav ul { display: flex; flex-wrap: nowrap; overflow-x: auto; min-width: 0; padding-bottom: .25rem; gap: .5rem; list-style: none; padding: 0; margin: 0; }
  .year-nav a { display: block; padding: .6rem .85rem; text-decoration: none; color: var(--muted); border-radius: 3px; }
  .year-nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  .challenge-heading { display: flex; align-items: end; justify-content: space-between; gap: 2rem; margin: 1rem 0 2rem; }
  .challenge-heading h2 { margin-bottom: .5rem; }
  .challenge-heading p { margin: 0; color: var(--muted); font-size: .9rem; }
  .progress-block { width: 12rem; flex-shrink: 0; }
  .progress-block label { margin: 0 0 .5rem; color: var(--muted); font-size: .75rem; font-weight: normal; }
  progress { display: block; width: 100%; height: .4rem; border: 0; background: var(--line); accent-color: var(--accent); border-radius: 2px; }
  progress::-webkit-progress-bar { background: var(--line); border-radius: 2px; }
  progress::-webkit-progress-value { background: var(--accent); border-radius: 2px; }
  progress::-moz-progress-bar { background: var(--accent); }
  .watchlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
  .watchlist > li { min-width: 0; }
  .movie-card { display: flex; flex-direction: column; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; border-top: 2px solid #626756; padding: 1.5rem; }
  .movie-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.25rem; }
  .slot { color: var(--accent); font: 600 .8rem/1.8 Barlow, sans-serif; text-transform: uppercase; letter-spacing: .06em; }
  .badge { font-size: .7rem; letter-spacing: .06em; border: 1px solid #626756; border-radius: 3px; padding: .2rem .5rem; color: var(--muted); }
  .badge.watched { background: #303b29; color: #d2e2bc; border-color: #56654a; }
  .release, .overview { color: var(--muted); font-size: .9rem; }
  .overview { margin-bottom: 1.5rem; }
  .rating { margin-top: auto; border-top: 1px solid var(--line); padding-top: 1rem; font-size: .85rem; margin-bottom: .5rem; }
  .ratings { list-style: none; padding: 0; margin: .5rem 0 0; color: var(--muted); font-size: .85rem; }
  .ratings li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .25rem 1rem; padding: .35rem 0; }
  .stars { color: var(--accent); letter-spacing: .12em; white-space: nowrap; }
  .empty-state { padding: 3.5rem 2rem; text-align: center; border: 1px solid var(--line); background: var(--panel); border-radius: 3px; }
  .empty-state h2 { font-size: 2.4rem; }
  .empty-state p { color: var(--muted); max-width: 32rem; margin: .75rem auto; }
  .skip-link { position: absolute; left: 1rem; top: -6rem; background: var(--ink); color: var(--paper); padding: .75rem; z-index: 1; }
  .skip-link:focus { top: 1rem; }
  @media (max-width: 52rem) { .household-layout { grid-template-columns: 1fr; gap: 1rem; } .hero { gap: 2rem; grid-template-columns: minmax(0, 1fr) 12rem; } .ticket-number { font-size: 8rem; } .watchlist { grid-template-columns: 1fr; } }
  @media (max-width: 36rem) { main { padding: 0 1.25rem 2rem; } .masthead { min-height: 5rem; flex-wrap: wrap; padding: 1rem 0; gap: .75rem; } .masthead-note { display: none; } .brand { font-size: 1.8rem; } .hero { grid-template-columns: 1fr; padding: 2rem 0; gap: 1rem; } .ticket { display: none; } .hero h1 { font-size: clamp(3.6rem, 14vw, 5rem); } .challenge-heading { align-items: start; flex-direction: column; gap: 1rem; } .progress-block { width: 100%; } .actions { align-items: stretch; flex-direction: column; } .actions button, .actions .button { width: 100%; text-align: center; } .admin-nav { gap: .75rem 1.25rem; } .admin-nav form { margin-left: 0; width: 100%; } .search-row { flex-direction: column; } .panel, .profile, .movie-card { padding: 1.25rem; } .auth-panel { margin-top: 2.5rem; } }

  /* Shared controls and native disclosures keep every page usable without JavaScript. */
  button, .button, input, select { min-height: 44px; }
  input, select { font-size: 1rem; }
  summary { cursor: pointer; width: fit-content; padding: .65rem 0; font-weight: 600; color: var(--accent); }
  summary:hover { color: var(--ink); }
  details[open] > summary { margin-bottom: .25rem; }
  .synopsis { margin: 0 0 1.25rem; font-size: .9rem; }
  .synopsis .overview { margin: .25rem 0 .75rem; }
  .profile-edit { margin: .5rem 0 1.25rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .profile-edit summary { font-size: .9rem; }
  .movie-card.is-watched { border-top-color: var(--accent); }
  .movie-card h3 { margin-bottom: .5rem; }
  .movie-card .release { margin-top: 0; }
  .movie-card .rating { color: var(--ink); }
  .movie-card .rating.muted { color: var(--muted); }
  .ticket { position: relative; border-bottom-style: dashed; }
  .hero-copy { margin-bottom: 1.5rem; }
  #challenge-heading { scroll-margin-top: 1.5rem; }
  .search-results { max-width: 48rem; }
  .movie-option { min-height: 4.5rem; }
  .movie-option input { min-height: 0; }
  .movie-option:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .result-title { font-size: 1.1rem; }
  .result-title small { display: inline-block; font-size: .9rem; }
  .pagination { justify-content: space-between; border-top: 1px solid var(--line); padding-top: 1rem; }
  .pagination a { padding: .65rem .25rem; }
  .danger { color: #ffd5c7 !important; border-color: #956554 !important; }
  .danger:hover { background: #402921 !important; }
  input[aria-invalid="true"] { border-color: #ff997f; }
  .token-page { max-width: 58rem; }
  .token { line-height: 1.8; }
  .auth-panel h1 { margin-top: .5rem; }
  .auth-panel form > button { width: 100%; margin-top: .5rem; }
  .masthead nav { min-width: 0; }
  .masthead nav > .muted { overflow-wrap: anywhere; }
  @media (max-width: 36rem) {
    .year-nav { display: block; }
    .year-nav ul { margin-top: .5rem; }
    .movie-meta { gap: .5rem; }
    .auth-panel { margin-bottom: 2rem; }
    .auth-panel .actions > a { width: 100%; text-align: center; }
    .hero .button { margin-bottom: .5rem; }
  }
  @media print {
    :root { color-scheme: light; --ink: #111; --paper: #fff; --panel: #fff; --accent: #222; --line: #aaa; --muted: #444; }
    body { font-size: 10pt; }
    main { max-width: none; padding: 0; }
    .masthead nav, .hero, .year-nav, .site-footer, .skip-link { display: none; }
    .watchlist { display: block; }
    .movie-card { break-inside: avoid; margin-bottom: 1rem; }
    .badge, .badge.watched { background: white; color: black; }
    .synopsis { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
{{end}}
{{define "admin_masthead"}}
<a class="skip-link" href="#content">Skip to content</a>
<div class="masthead"><a class="brand" href="/admin/movies/search">Screamtober</a><span class="masthead-note">Behind the screams / Admin</span></div>
{{end}}
{{define "admin_nav"}}
<nav class="admin-nav" aria-label="Administration">
  <a href="/admin/users"{{if eq . "household"}} aria-current="page"{{end}}>Household</a>
  <a href="/admin/movies/search"{{if eq . "movies"}} aria-current="page"{{end}}>Search movies</a>
  <form method="post" action="/admin/logout"><button class="secondary" type="submit">Sign out of admin</button></form>
</nav>
{{end}}
{{define "site_footer"}}
<footer class="site-footer"><p>Screamtober · A household October tradition.</p><p>Lights off. Something good is on.</p></footer>
{{end}}
