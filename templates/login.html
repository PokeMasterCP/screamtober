<!doctype html>
<html lang="en">
<head>
  {{template "page_head"}}
  <title>Sign in · Screamtober</title>
  {{template "site_style"}}
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-group"><a class="brand" href="/">Screamtober</a></div>
    <span class="chip">Admit one</span>
  </div>
</header>
<main class="auth-page">
  <div class="auth-panel auth-login panel" id="content">
    <h1>Sign in</h1>
    <p class="auth-prompt">Use your household token to continue.</p>
    {{if .InvalidToken}}<p class="error" id="login-error" role="alert">Invalid login token. Please try again.</p>{{end}}
    <form method="post" action="/login">
      <label for="token">Household token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required{{if .InvalidToken}} aria-invalid="true" aria-describedby="login-error"{{end}}>
      <button type="submit">Sign in</button>
    </form>
    <p class="auth-back"><a href="/">← Back to Screamtober</a></p>
  </div>
</main>
</body>
</html>
